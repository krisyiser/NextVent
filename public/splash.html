<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando NextVent...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; }
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .animate-loading {
            animation: loading 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-transparent flex justify-center items-center h-screen w-screen">
    <div class="w-[500px] h-[300px] bg-slate-950 rounded-xl border border-slate-800 flex flex-col justify-center items-center select-none p-8 shadow-2xl relative overflow-hidden">
        
        <img src="/logo.png" alt="NextVent Logo" class="w-20 h-20 object-contain mb-4 animate-pulse" />

        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 mb-8">
            NextVent
        </h1>
        
        <div class="w-64 h-1.5 bg-slate-800 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-cyan-500 to-emerald-500 animate-loading rounded-full w-1/2"></div>
        </div>
        
        <span class="text-xs text-slate-500 mt-4 font-mono">Inicializando entorno seguro Tauri v2...</span>
    </div>

    <!-- We don't close the window here, the Main window will close it via AuthGuard -->
</body>
</html>
